name: Manual Tag and Release Production

# Pipeline ini sekarang hanya akan berjalan ketika dipicu secara manual (menggunakan tombol Run workflow)
on:
  workflow_dispatch:

jobs:
  build-and-tag:
    runs-on: ubuntu-latest
    
    # Menambahkan konfigurasi ini untuk menghilangkan warning Node.js 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    # Memberikan izin kepada GitHub Actions untuk membuat tag dan release di repository
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: '0' # Penting: mengambil seluruh riwayat commit untuk menentukan versi tag berikutnya

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # Otomatis menaikkan angka terakhir (misal: v1.0.0 menjadi v1.0.1)
          
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}