# Reproducible local/pilot deployment for E-Tourism CV Kopi Danau Diatas.
#
# Services mirror what production actually needs:
#   app        — the web application (php artisan serve on :8000)
#   queue      — the queue worker (without it, confirmation e-mails never send)
#   scheduler  — the cron runner (without it, quota never frees & auto-complete dies)
#   reverb     — websocket server for realtime admin notifications
#   cloudflared — exposes app+reverb over HTTPS/WSS with no port-forwarding or
#                 certificate management (optional — remove if you terminate
#                 TLS some other way, e.g. Caddy/Nginx + a public IP)
#   db         — MySQL 8
#
# Usage:
#   1. Copy .env.example -> .env, then set:  DB_HOST=db  DB_CONNECTION=mysql
#      DB_DATABASE / DB_USERNAME / DB_PASSWORD (match the db service below).
#   2. docker compose build
#   3. docker compose run --rm app php artisan key:generate
#   4. docker compose up -d
#
# See docs/deployment.md for the full walkthrough (including the Cloudflare
# Tunnel dashboard setup that TUNNEL_TOKEN below depends on).

# app/queue/scheduler/reverb all build the same image, so the Vite build
# args (baked into the JS bundle — see Dockerfile) must be identical on all
# four regardless of which one `docker compose build` happens to build last.
x-build: &build
  context: .
  args:
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST}
    VITE_REVERB_PORT: ${VITE_REVERB_PORT}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME}

services:
  app:
    build: *build
    image: kopi-danau-atas:latest
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build: *build
    image: kopi-danau-atas:latest
    env_file: .env
    command: php artisan queue:work --tries=3 --max-time=3600
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: *build
    image: kopi-danau-atas:latest
    env_file: .env
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  reverb:
    build: *build
    image: kopi-danau-atas:latest
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
      - reverb
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kopi_danau_atas}
      MYSQL_USER: ${DB_USERNAME:-kopi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  dbdata:
